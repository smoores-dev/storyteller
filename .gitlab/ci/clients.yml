# CI for the v3 native clients (applications/clients + libraries/StorytellerKit).

.clients-rules:
  rules:
    - if:
        ($CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_COMMIT_BRANCH ==
        "main" && $CI_COMMIT_TAG == null))
      changes:
        - applications/clients/**/*
        - applications/mobile/assets/storyteller-ios.icon/**/*
        - libraries/StorytellerKit/**/*
        - Package.swift
        - Package.resolved
        - .gitlab/ci/clients.yml

.macos_runner:
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26

.clients-variables:
  variables:
    HOMEBREW_NO_AUTO_UPDATE: "1"
    LANG: en_US.UTF-8
    STORYTELLER_DISABLE_CODE_SIGNING: "1"
    STORYTELLER_IOS_DESTINATION: generic/platform=iOS Simulator
    STORYTELLER_TVOS_DESTINATION: generic/platform=tvOS Simulator
    STORYTELLER_WATCHOS_DESTINATION: generic/platform=watchOS Simulator

apple_setup:
  extends: [.macos_runner, .clients-rules, .clients-variables]
  stage: check
  script:
    - cd applications/clients
    - brew install imagemagick xcbeautify xcodegen
    - ./scripts/genicons
    - ./scripts/genxproj
    - mkdir -p Storyteller.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
    - cp ../../Package.resolved
      Storyteller.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
    - mkdir -p .ci-tools
    - cp "$(brew --prefix xcbeautify)/bin/xcbeautify" .ci-tools/
  artifacts:
    expire_in: 1 day
    paths:
      - applications/clients/.ci-tools/xcbeautify
      - applications/clients/Storyteller.xcodeproj/
      - applications/clients/XCodeApps/Info-iOS.plist
      - applications/clients/XCodeApps/Info-macOS.plist
      - applications/clients/XCodeApps/Info-tvOS.plist
      - applications/clients/XCodeApps/Info-watchOS.plist
      - applications/clients/XCodeApps/Storyteller.icon/
      - applications/clients/XCodeApps/Assets.xcassets/StorytellerLogo.imageset/
      - applications/clients/XCodeApps/TVAssets.xcassets/

apple_apps:
  extends: [.macos_runner, .clients-rules, .clients-variables]
  tags:
    - saas-macos-large-m2pro
  stage: check
  needs:
    - job: apple_setup
      artifacts: true
  parallel:
    matrix:
      - BUILD_SCRIPT:
          - macbuild
          - iosbuild
          - tvbuild
          - watchbuild
  before_script:
    - export PATH="${CI_PROJECT_DIR}/applications/clients/.ci-tools:${PATH}"
  script:
    - cd applications/clients
    - "./scripts/${BUILD_SCRIPT}"

android_app:
  extends: [.macos_runner, .clients-rules, .clients-variables]
  stage: check
  needs: []
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/applications/clients/.ci-cache/gradle
    JAVA_HOME: /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
  cache:
    key:
      files:
        - Package.resolved
        - applications/clients/AndroidApp/app/build.gradle.kts
      prefix: android
    paths:
      - applications/clients/.ci-cache/android-sdk/
      - applications/clients/.ci-cache/downloads/
      - applications/clients/.ci-cache/gradle/
      - applications/clients/AndroidApp/swift/.build/
  before_script:
    - cd applications/clients
    - source ci_scripts/gitlab_setup_android.sh
    - ./scripts/genicons
  script:
    - ./scripts/androidbuild
    - '"${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose
      --print-certs AndroidApp/app/build/outputs/apk/debug/app-debug.apk'
    - mv AndroidApp/app/build/outputs/apk/debug/app-debug.apk
      AndroidApp/app/build/outputs/apk/debug/storyteller-debug.apk
  artifacts:
    name: storyteller-clients-android-$CI_COMMIT_SHORT_SHA
    expire_in: 1 week
    paths:
      - applications/clients/AndroidApp/app/build/outputs/apk/debug/storyteller-debug.apk
