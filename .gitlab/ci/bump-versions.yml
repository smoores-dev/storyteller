bump-versions:
  stage: prerelease
  image: node:24
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - apt update && apt install -y --no-install-recommends git-lfs
    - git remote set-url origin
      https://ci-push-tag-token:${CI_PUSH_TAG_TOKEN}@gitlab.com/storyteller-platform/storyteller.git
    - npm i -g corepack
    - yarn workspaces focus storyteller
    - yarn node ./scripts/bumpVersions.mts

pages:
  image: node:24-alpine
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^docs-v?\d+\.\d+\.\d+$/'
  script:
    - apk update
    - apk add git
    - npm i -g corepack
    - yarn workspaces focus @storyteller-platform/docs
    - yarn build:docs
  artifacts:
    paths:
      - public
