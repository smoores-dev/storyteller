publish-fs:
  image: node:24
  stage: publish
  rules:
    - if:
        '$CI_COMMIT_TAG =~
        /^fs-v?\d+\.\d+\.\d+(?:-(?:alpha|beta|rc|experimental|dev|test|preview)(?:\.\d+)?)?$/'
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  variables:
    GITLAB: "true"
  script:
    - TAG=${CI_COMMIT_TAG##*-}
    - |
      case "$TAG" in
        alpha*) TAG="alpha" ;;
        beta*) TAG="beta" ;;
        rc*) TAG="rc" ;;
        experimental*) TAG="experimental" ;;
        dev*) TAG="dev" ;;
        test*) TAG="test" ;;
        preview*) TAG="preview" ;;
        *) TAG="latest" ;;
      esac
    - npm i -g corepack
    - yarn workspaces focus @storyteller-platform/fs
    - yarn workspace @storyteller-platform/fs npm publish --tag="$TAG"

prerelease-fs:
  extends: .prerelease-base
  variables:
    PACKAGE: fs
  rules:
    - if:
        '$CI_COMMIT_TAG =~
        /^fs-v?\d+\.\d+\.\d+(?:-(?:alpha|beta|rc|experimental|dev|test|preview)(?:\.\d+)?)?$/'

release-fs:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: prerelease-fs
      artifacts: true
  rules:
    - if:
        '$CI_COMMIT_TAG =~
        /^fs-v?\d+\.\d+\.\d+(?:-(?:alpha|beta|rc|experimental|dev|test|preview)(?:\.\d+)?)?$/'
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    name: "Release $CI_COMMIT_TAG"
    description: release_notes.md
    tag_name: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
