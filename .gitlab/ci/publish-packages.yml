.publish-align-sea-base:
  stage: publish
  rules:
    - if:
        '$CI_COMMIT_TAG =~
        /^align-v?\d+\.\d+\.\d+(?:-(?:alpha|beta|rc|experimental|dev|test|preview)(?:\.\d+)?)?$/'
  script:
    - npm i -g --force corepack
    - yarn workspaces focus @storyteller-platform/align
    - yarn workspace @storyteller-platform/align compile
    - |
      PACKAGE_ID=$(curl -s --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=stalign&package_version=${CI_COMMIT_TAG}" \
        | jq -r '.[0].id // empty')
      if [ -n "$PACKAGE_ID" ]; then
        FILE_IDS=$(curl -s --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PACKAGE_ID}/package_files" \
          | jq -r ".[] | select(.file_name == \"stalign-${VARIANT}\") | .id")
        for FILE_ID in $FILE_IDS; do
          echo "Deleting file ID: $FILE_ID"
          curl -s --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PACKAGE_ID}/package_files/${FILE_ID}"
        done
      fi
    - if [ -n "${CODESIGNING}" ]; then echo "Signing executable..."; fi
    - if [ -n "${CODESIGNING}" ]; then codesign --sign "$APPLE_SIGNING_IDENTITY"
      --force --options runtime --timestamp --entitlements
      libraries/align/entitlements.plist ./libraries/align/stalign; fi
    - if [ -n "${CODESIGNING}" ]; then codesign --verify --verbose
      ./libraries/align/stalign; fi
    - |
      if [ -n "${CODESIGNING}" ]; then
        echo "Notarizing executable..."
        rm -f stalign-notarize.zip notarization.json
        ditto -c -k ./libraries/align/stalign stalign-notarize.zip
        xcrun notarytool submit stalign-notarize.zip \
          --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
          --wait --timeout 30m --output-format json > notarization.json
        cat notarization.json
        if [ "$(jq -r .status notarization.json)" != "Accepted" ]; then
          xcrun notarytool log "$(jq -r .id notarization.json)" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          exit 1
        fi
        rm -f stalign-notarize.zip notarization.json
      fi
    - if [ -n "${CODESIGNING}" ]; then spctl --assess --type execute --verbose
      ./libraries/align/stalign; fi

    - echo "Uploading to GitLab Generic Package Registry..."
    - VERSION_PARTS=($(echo "$CI_COMMIT_TAG" | tr 'v' ' '))
    - echo v${VERSION_PARTS[1]}
    - |
      curl --fail-with-body --show-error \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file libraries/align/stalign \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stalign/${VERSION_PARTS[1]}/stalign-${VARIANT}"

publish-align-sea-darwin-arm64:
  extends: .publish-align-sea-base
  tags: [saas-macos-medium-m1]
  variables:
    VARIANT: "darwin-arm64"
    KEYCHAIN_NAME: "build-$CI_JOB_ID.keychain"
    KEYCHAIN_PASSWORD: "temp-keychain-password"
    CODESIGNING: "true"
  before_script:
    - brew install curl
    - export NVM_DIR="$HOME/.nvm"
    - source "$NVM_DIR/nvm.sh"
    - nvm install 25
    - nvm use 25
    - nvm alias default 25
    - security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
    - security list-keychains -d user -s "$KEYCHAIN_NAME" $(security
      list-keychains -d user | tr -d '"')
    - security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
    - security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
    - echo "$APPLE_CERTIFICATE_P12" | base64 --decode > certificate.p12
    - security import certificate.p12 -k "$KEYCHAIN_NAME" -P
      "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
    - echo "$APPLE_CA" | base64 --decode > developer_id_cert_authority.cer
    - security import developer_id_cert_authority.cer -k "$KEYCHAIN_NAME" -T
      /usr/bin/codesign
    - 'security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k
      "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"'
    - security find-identity -v -p codesigning "$KEYCHAIN_NAME"
  after_script:
    - security delete-keychain "$KEYCHAIN_NAME" || true
    - rm -f certificate.p12

publish-align-sea-linux-x64:
  image: node:25
  extends: .publish-align-sea-base
  variables:
    VARIANT: "linux-x64"
  before_script:
    - apt update
    - DEBIAN_FRONTEND=noninteractive apt install -y jq

publish-align-sea-linux-arm64:
  image: node:25
  extends: .publish-align-sea-base
  tags: [saas-linux-small-arm64]
  variables:
    VARIANT: "linux-arm64"
  before_script:
    - apt update
    - DEBIAN_FRONTEND=noninteractive apt install -y jq

publish-align-sea-windows-x64:
  stage: publish
  rules:
    - if:
        '$CI_COMMIT_TAG =~
        /^align-v?\d+\.\d+\.\d+(?:-(?:alpha|beta|rc|experimental|dev|test|preview)(?:\.\d+)?)?$/'
  tags: [saas-windows-medium-amd64]
  before_script:
    - |
      $refreshPath = {
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
      }
      $requiredNode = "25.9.0"
      $nodeOk = $false
      if (Get-Command node -ErrorAction SilentlyContinue) {
        $installedNode = (node --version).TrimStart('v')
        if ($installedNode -eq $requiredNode) {
          $nodeOk = $true
        }
      }
      if (-not $nodeOk) {
        if (Get-Command choco -ErrorAction SilentlyContinue) {
          choco install -y nodejs --version=$requiredNode
          & $refreshPath
        } else {
          throw "node $requiredNode is required on the windows runner"
        }
      }
      npm i -g corepack
      & $refreshPath
      corepack enable
      corepack prepare yarn@4.12.0 --activate
      & $refreshPath
      node --version
      yarn --version
  script:
    - npm i -g corepack
    - yarn workspaces focus @storyteller-platform/align
    - yarn workspace @storyteller-platform/align compile
    - |
      # Look up existing package
      $packagesResponse = Invoke-RestMethod `
        -Uri "${env:CI_API_V4_URL}/projects/${env:CI_PROJECT_ID}/packages?package_name=stalign&package_version=${env:CI_COMMIT_TAG}" `
        -Headers @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN }

      $packageId = $packagesResponse[0].id

      if ($packageId) {
        $filesResponse = Invoke-RestMethod `
          -Uri "${env:CI_API_V4_URL}/projects/${env:CI_PROJECT_ID}/packages/${packageId}/package_files" `
          -Headers @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN }

        $fileIds = $filesResponse | Where-Object { $_.file_name -eq "stalign-${env:VARIANT}" } | Select-Object -ExpandProperty id

        foreach ($fileId in $fileIds) {
          Write-Output "Deleting file ID: $fileId"
          Invoke-RestMethod `
            -Method DELETE `
            -Uri "${env:CI_API_V4_URL}/projects/${env:CI_PROJECT_ID}/packages/${packageId}/package_files/${fileId}" `
            -Headers @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN }
        }
      }

    - Write-Output "Uploading to GitLab Generic Package Registry..."
    - $version = $env:CI_COMMIT_TAG -replace '^align-v', ''
    - Write-Output "v${version}"
    - |
      $filePath = Resolve-Path "libraries/align/stalign.exe"
      $fileBytes = [System.IO.File]::ReadAllBytes($filePath)
      Invoke-RestMethod `
        -Method PUT `
        -Uri "${env:CI_API_V4_URL}/projects/${env:CI_PROJECT_ID}/packages/generic/stalign/${version}/stalign.exe" `
        -Headers @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN } `
        -Body $fileBytes `
        -ContentType "application/octet-stream"

publish-align:
  image: node:25
  stage: publish
  rules:
    - if:
        '$CI_COMMIT_TAG =~
        /^align-v?\d+\.\d+\.\d+(?:-(?:alpha|beta|rc|experimental|dev|test|preview)(?:\.\d+)?)?$/'
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  variables:
    GITLAB: "true"
  script:
    - TAG=${CI_COMMIT_TAG##*-}
    - |
      case "$TAG" in
        alpha*) TAG="alpha" ;;
        beta*) TAG="beta" ;;
        rc*) TAG="rc" ;;
        experimental*) TAG="experimental" ;;
        dev*) TAG="dev" ;;
        test*) TAG="test" ;;
        preview*) TAG="preview" ;;
        *) TAG="latest" ;;
      esac
    - npm i -g --force corepack
    - yarn workspaces focus @storyteller-platform/align
    - yarn workspace @storyteller-platform/align npm publish --tag="$TAG"

