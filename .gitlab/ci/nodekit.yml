# CI for building and publishing @storyteller-platform/nodekit per-platform binaries.
#
# Check jobs (MR/main, only when nodekit-relevant files change):
#   macOS ARM64, Linux GNU x64, Windows x64, Windows ARM64
#
# Release builds (on nodekit-v* tag, full matrix):
#   macOS ARM64, macOS x64, Linux GNU x64, Linux GNU ARM64,
#   Windows x64, Windows ARM64
#
# Note: no musl targets
# Note: darwin-x64 and win32-arm64 are cross built on arm64/x64 runners, so
# they get an arch assertion (lipo/dumpbin) instead of the runtime load test

# --- rules ---

.nodekit-check-rules:
  rules:
    - if:
        ($CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_COMMIT_BRANCH ==
        "main" && $CI_COMMIT_TAG == null))
      changes:
        - libraries/StorytellerKit/**/*
        - libraries/nodekit/**/*
        - Package.swift
        - Package.resolved
        - .gitlab/ci/nodekit.yml

.nodekit-tag-rules:
  rules:
    - if:
        '$CI_COMMIT_TAG =~
        /^nodekit-v?\d+\.\d+\.\d+(?:-(?:alpha|beta|rc|experimental|dev|test|preview)(?:\.\d+)?)?$/'

# --- load test anchor ---

# note: don't try to add more things here, this needs to run on macos/linux and windows
.nodekit-load-test:
  &nodekit-load-test node libraries/nodekit/scripts/load-test.mjs

# --- base templates ---

.nodekit-build-macos-base:
  tags: [saas-macos-medium-m1]
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - export NVM_DIR="$HOME/.nvm"
    - source "$NVM_DIR/nvm.sh"
    - nvm install 24
    - nvm use 24
    - nvm alias default 24
    - swift --version
  cache:
    key:
      files:
        - Package.resolved
      prefix: nodekit-macos-${NAPI_TARGET}
    paths:
      - .build
  script:
    # need to specify arch here to publish x64 binary on macos arm64 runner
    - swift build -c release --arch "${SWIFT_ARCH}" --product StorytellerNodeKit
      --disable-prefetching
    - BUILT="$(swift build -c release --arch "${SWIFT_ARCH}" --show-bin-path)"
    - cp "${BUILT}/libStorytellerNodeKit.dylib"
      "libraries/nodekit/nodekit.${NAPI_TARGET}.node"
    - lipo -archs "libraries/nodekit/nodekit.${NAPI_TARGET}.node" | grep -qw
      "${SWIFT_ARCH}"
    - echo "Wrote libraries/nodekit/nodekit.${NAPI_TARGET}.node (${SWIFT_ARCH})"
    - *nodekit-load-test
  artifacts:
    paths:
      - libraries/nodekit/nodekit.*.node

.nodekit-build-linux-base:
  image: swift:6.3-noble
  cache:
    key:
      files:
        - Package.resolved
      prefix: nodekit-linux-${NAPI_TARGET}
    paths:
      - .build
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends wget xz-utils
    - TARGETARCH=${LINUX_ARCH} ./scripts/install-node.sh
  script:
    - swift build -c release --product StorytellerNodeKit -Xswiftc
      -static-stdlib
    - BUILT="$(swift build -c release --show-bin-path)"
    - cp "${BUILT}/libStorytellerNodeKit.so"
      "libraries/nodekit/nodekit.${NAPI_TARGET}.node"
    - echo "Wrote libraries/nodekit/nodekit.${NAPI_TARGET}.node"
    - "! ldd libraries/nodekit/nodekit.${NAPI_TARGET}.node | grep -iE
      'swift|foundation|dispatch'"
    - *nodekit-load-test
  artifacts:
    paths:
      - libraries/nodekit/nodekit.*.node

.nodekit-build-windows-base:
  tags: [saas-windows-medium-amd64]
  timeout: 2h
  variables:
    SWIFT_VERSION: "6.3.3"
    ZLIB_VERSION: "1.3.1"
    NODE_VERSION: "24.19.0"
  cache:
    key:
      files:
        - Package.resolved
      prefix: nodekit-windows-${NAPI_TARGET}
    paths:
      - .build
  script:
    - curl.exe -fsSL -o swift-installer.exe
      "https://download.swift.org/swift-$env:SWIFT_VERSION-release/windows10/swift-$env:SWIFT_VERSION-RELEASE/swift-$env:SWIFT_VERSION-RELEASE-windows10.exe"
    - Start-Process -Wait -FilePath .\swift-installer.exe -ArgumentList
      "/quiet","/norestart"
    - $vsInstallerDir = "${env:ProgramFiles(x86)}\Microsoft Visual
      Studio\Installer"
    - $vsPath = & "$vsInstallerDir\vswhere.exe" -latest -products * -property
      installationPath
    - if (-not $vsPath) { throw "no visual studio build tools install found" }
    # this block deliberately never aborts: a throw from inside a multi-line
    # block does not fail the job (gitlab only reliably checks the status of a
    # script entry), so it only logs, and the single-line assert below decides.
    - |
      $vswhere = "$vsInstallerDir\vswhere.exe"
      $hasComponent = & $vswhere -latest -products * `
        -requires $env:WIN_VS_COMPONENT -property installationPath
      if (-not $hasComponent) {
        Write-Output "adding $env:WIN_VS_COMPONENT to $vsPath"
        # setup.exe rather than vs_installer.exe, and no --wait: microsoft
        # documents --wait as bootstrapper-only, and passing it to the
        # installer fails the command line parse with exit code 87
        $modifyArgs = "modify --installPath `"$vsPath`" --add $env:WIN_VS_COMPONENT --quiet --norestart --nocache"
        $proc = Start-Process -FilePath "$vsInstallerDir\setup.exe" `
          -ArgumentList $modifyArgs -Wait -PassThru
        Write-Output "vs setup.exe modify exited with $($proc.ExitCode)"
        # setup.exe can hand off to a background process and return early, so
        # poll for the component rather than trusting the exit code. 740 is
        # elevation required, 5007 blocked, 1602 cancelled -- no point waiting.
        $deadline = (Get-Date).AddMinutes(30)
        if (@(740, 5007, 1602) -contains $proc.ExitCode) {
          Write-Output "modify cannot proceed, not waiting"
          $deadline = Get-Date
        }
        while (-not $hasComponent -and (Get-Date) -lt $deadline) {
          Start-Sleep -Seconds 15
          $hasComponent = & $vswhere -latest -products * `
            -requires $env:WIN_VS_COMPONENT -property installationPath
        }
        Write-Output "component present after modify: $([bool]$hasComponent)"
      }
    - if (-not (& "$vsInstallerDir\vswhere.exe" -latest -products * -requires
      $env:WIN_VS_COMPONENT -property installationPath)) { throw
      "$env:WIN_VS_COMPONENT is not installed" }
    - Import-Module (Join-Path $vsPath
      "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
    - Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation
      -DevCmdArguments "-arch=x64 -host_arch=x64"
    - $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" +
      $env:Path
    - $env:Path =
      "$env:LOCALAPPDATA\Programs\Swift\Toolchains\$env:SWIFT_VERSION+Asserts\usr\bin;$env:LOCALAPPDATA\Programs\Swift\Runtimes\$env:SWIFT_VERSION\usr\bin;$env:Path"
    - $env:SDKROOT = [Environment]::GetEnvironmentVariable("SDKROOT", "User")
    - if (-not $env:SDKROOT) { $env:SDKROOT =
      [Environment]::GetEnvironmentVariable("SDKROOT", "Machine") }
    - curl.exe -fsSL -o zlib.tar.gz
      "https://github.com/madler/zlib/releases/download/v$env:ZLIB_VERSION/zlib-$env:ZLIB_VERSION.tar.gz"
    - tar -xf zlib.tar.gz
    - cmake -S "zlib-$env:ZLIB_VERSION" -B zlib-build -G "Visual Studio 17 2022"
      -A $env:WIN_CMAKE_ARCH
      -DCMAKE_INSTALL_PREFIX="$env:CI_PROJECT_DIR\zlib-install"
    - cmake --build zlib-build --config Release --target install
    - Copy-Item "$env:CI_PROJECT_DIR\zlib-install\lib\zlibstatic.lib"
      "$env:CI_PROJECT_DIR\zlib-install\lib\z.lib"
    - curl.exe -fsSL -o node.zip
      "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip"
    - tar -xf node.zip
    - $env:Path =
      "$env:CI_PROJECT_DIR\node-v$env:NODE_VERSION-win-x64;$env:Path"
    - $nodeVersion = (node -v)
    # node.lib follows the target arch, the node binary above stays x64 (host)
    - curl.exe -fsSL -o node.lib
      "https://nodejs.org/dist/$nodeVersion/win-$env:WIN_NODE_ARCH/node.lib"
    # fail loudly here rather than as a missing swiftCore.lib below
    - |
      $swiftLibRoot = Join-Path $env:SDKROOT "usr\lib\swift\windows"
      Write-Output "swift target libs available under ${swiftLibRoot}:"
      Get-ChildItem $swiftLibRoot -Directory -ErrorAction SilentlyContinue |
        ForEach-Object { Write-Output "  $($_.Name)" }
    - |
      $linkArgs = @(
        "-Xlinker", "/LIBPATH:$env:CI_PROJECT_DIR\zlib-install\lib",
        "-Xlinker", "$env:CI_PROJECT_DIR\node.lib"
      )
      $toolsetArgs = @()
      if ($env:WIN_VCVARS_ARCH -ne "x64") {
        $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
        $targetLib = (cmd /c """$vcvars"" $env:WIN_VCVARS_ARCH && set LIB") |
          Where-Object { $_ -match '^LIB=' } |
          ForEach-Object { $_.Substring(4) } |
          Select-Object -First 1
        if (-not $targetLib) {
          Write-Output "could not resolve LIB for $env:WIN_VCVARS_ARCH"
          exit 1
        }
        Write-Output "target lib dirs: $targetLib"
        $linkerOpts = @()
        foreach ($dir in ($targetLib -split ';' | Where-Object { $_ })) {
          $linkerOpts += "/LIBPATH:$dir"
        }
        $linkerOpts += "/LIBPATH:$env:CI_PROJECT_DIR\zlib-install\lib"
        $linkerOpts += "$env:CI_PROJECT_DIR\node.lib"
        $toolsetPath = "$env:CI_PROJECT_DIR\target-toolset.json"
        @{
          schemaVersion = "1.0"
          linker = @{ extraCLIOptions = $linkerOpts }
        } | ConvertTo-Json -Depth 5 | Set-Content -Path $toolsetPath -Encoding utf8
        Write-Output "--- $toolsetPath ---"
        Get-Content $toolsetPath | Write-Output
        $linkArgs = @()
        $toolsetArgs = @("--toolset", $toolsetPath)
      }
    # this builds release only because three functions in StorytellerKit are
    # marked @_optimize(none) under #if os(Windows).
    # TODO: report bug to apple
    - |
      & swift build -c release --triple $env:SWIFT_TRIPLE `
        --product StorytellerNodeKit `
        -Xcc "-I$env:CI_PROJECT_DIR\zlib-install\include" `
        @toolsetArgs @linkArgs
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - $BUILT = (swift build -c release --triple $env:SWIFT_TRIPLE
      --show-bin-path)
    - Copy-Item "$BUILT\StorytellerNodeKit.dll"
      "libraries\nodekit\nodekit.${env:NAPI_TARGET}.node"
    # the load test skips cross-built targets, so assert the machine type here
    - $machine = (dumpbin /headers
      "libraries\nodekit\nodekit.${env:NAPI_TARGET}.node" | Select-String
      -Pattern 'machine \(')
    - Write-Output "$machine"
    - if ("$machine" -notmatch [regex]::Escape($env:WIN_MACHINE)) { throw
      "expected machine type $env:WIN_MACHINE but got $machine" }
    - *nodekit-load-test
  artifacts:
    paths:
      - libraries/nodekit/nodekit.*.node

.nodekit-build-windows-x64-base:
  extends: .nodekit-build-windows-base
  variables:
    NAPI_TARGET: win32-x64-msvc
    WIN_VCVARS_ARCH: x64
    WIN_VS_COMPONENT: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
    WIN_CMAKE_ARCH: x64
    WIN_NODE_ARCH: x64
    WIN_MACHINE: x64
    SWIFT_TRIPLE: x86_64-unknown-windows-msvc

.nodekit-build-windows-arm64-base:
  extends: .nodekit-build-windows-base
  variables:
    NAPI_TARGET: win32-arm64-msvc
    WIN_VCVARS_ARCH: x64_arm64
    WIN_VS_COMPONENT: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    WIN_CMAKE_ARCH: ARM64
    WIN_NODE_ARCH: arm64
    WIN_MACHINE: ARM64
    SWIFT_TRIPLE: aarch64-unknown-windows-msvc

# --- check jobs ---

check-nodekit-darwin-arm64:
  extends: [.nodekit-check-rules, .nodekit-build-macos-base]
  stage: check
  needs: []
  variables:
    NAPI_TARGET: darwin-arm64
    SWIFT_ARCH: arm64

check-nodekit-linux-x64-gnu:
  extends: [.nodekit-check-rules, .nodekit-build-linux-base]
  stage: check
  tags: [saas-linux-large-amd64]
  needs: []
  variables:
    NAPI_TARGET: linux-x64-gnu
    LINUX_ARCH: amd64

check-nodekit-win32-x64-msvc:
  # these are so god damned slow
  allow_failure: true
  extends: [.nodekit-check-rules, .nodekit-build-windows-x64-base]
  stage: check
  needs: []

check-nodekit-win32-arm64-msvc:
  # these are so god damned slow
  allow_failure: true
  extends: [.nodekit-check-rules, .nodekit-build-windows-arm64-base]
  stage: check
  needs: []

# --- release build jobs ---

build-nodekit-darwin-arm64:
  extends: [.nodekit-tag-rules, .nodekit-build-macos-base]
  stage: build-base
  variables:
    NAPI_TARGET: darwin-arm64
    SWIFT_ARCH: arm64

build-nodekit-darwin-x64:
  extends: [.nodekit-tag-rules, .nodekit-build-macos-base]
  stage: build-base
  variables:
    NAPI_TARGET: darwin-x64
    SWIFT_ARCH: x86_64

build-nodekit-linux-x64-gnu:
  extends: [.nodekit-tag-rules, .nodekit-build-linux-base]
  stage: build-base
  tags: [saas-linux-large-amd64]
  variables:
    NAPI_TARGET: linux-x64-gnu
    LINUX_ARCH: amd64

build-nodekit-linux-arm64-gnu:
  extends: [.nodekit-tag-rules, .nodekit-build-linux-base]
  stage: build-base
  tags: [saas-linux-large-arm64]
  variables:
    NAPI_TARGET: linux-arm64-gnu
    LINUX_ARCH: arm64

build-nodekit-win32-x64-msvc:
  extends: [.nodekit-tag-rules, .nodekit-build-windows-x64-base]
  stage: build-base

build-nodekit-win32-arm64-msvc:
  extends: [.nodekit-tag-rules, .nodekit-build-windows-arm64-base]
  stage: build-base

# --- publish ---

# see ./publish-packages.yml in the okmain section, which this is based on
publish-nodekit:
  image: node:24
  stage: publish
  extends: .nodekit-tag-rules
  needs:
    - job: build-nodekit-darwin-arm64
      artifacts: true
    - job: build-nodekit-darwin-x64
      artifacts: true
    - job: build-nodekit-linux-x64-gnu
      artifacts: true
    - job: build-nodekit-linux-arm64-gnu
      artifacts: true
    - job: build-nodekit-win32-x64-msvc
      artifacts: true
    - job: build-nodekit-win32-arm64-msvc
      artifacts: true
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  variables:
    GITLAB: "true"
  script:
    - TAG=${CI_COMMIT_TAG##*-}
    - |
      case "$TAG" in
        alpha*) TAG="alpha" ;;
        beta*) TAG="beta" ;;
        rc*) TAG="rc" ;;
        experimental*) TAG="experimental" ;;
        dev*) TAG="dev" ;;
        test*) TAG="test" ;;
        preview*) TAG="preview" ;;
        *) TAG="latest" ;;
      esac
    - npm i -g corepack
    - corepack enable
    - yarn workspaces focus @storyteller-platform/nodekit
    - ls -lah libraries/nodekit/*.node
    # napi artifacts reads from ./artifacts, the build jobs drop the .node files
    # next to package.json
    - mkdir -p libraries/nodekit/artifacts
    - mv libraries/nodekit/*.node libraries/nodekit/artifacts/
    - yarn workspace @storyteller-platform/nodekit napi create-npm-dirs # creates the npm dirs
    - yarn workspace @storyteller-platform/nodekit napi artifacts # moves all the artifacts to the correct npm dir
    - ls -latR libraries/nodekit/npm
    - export npm_config_tag="$TAG" # necessary because napi prepublish script reads the tag from this env var as the republish the subpackages w/ npm
    - yarn workspace @storyteller-platform/nodekit npm publish --tag="$TAG"
      --access public

prerelease-nodekit:
  stage: prerelease
  image: alpine:latest
  extends: .nodekit-tag-rules
  script:
    - apk add curl jq
    - version=$(echo $CI_COMMIT_TAG | sed -r 's/nodekit-//')
    - package=$(echo $CI_COMMIT_TAG | sed -r 's/-v\d+\.\d+\.\d+.*$//')
    - 'from_sha=$(curl -H "PRIVATE-TOKEN: $CI_API_TOKEN"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" | jq -r "first(.[] |
      select(.tag_name | startswith(\"$package\")) | .commit.short_id)")'
    - to_sha=$CI_COMMIT_SHORT_SHA
    - 'curl -H "PRIVATE-TOKEN: $CI_API_TOKEN"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?version=${version}&from=${from_sha}&to=${to_sha}&trailer=Changelog-nodekit"
      | jq -r .notes > release_notes.md'
  artifacts:
    paths:
      - release_notes.md

release-nodekit:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: prerelease-nodekit
      artifacts: true
  extends: .nodekit-tag-rules
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    name: "Release $CI_COMMIT_TAG"
    description: release_notes.md
    tag_name: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "NPM package for @storyteller-platform/nodekit"
          url: "https://npmjs.com/package/@storyteller-platform/nodekit"
