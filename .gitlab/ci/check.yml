check:
  image: registry.gitlab.com/storyteller-platform/storyteller/storyteller-base:main
  stage: check
  tags: [saas-linux-large-amd64]
  rules:
    - if:
        ($CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_COMMIT_BRANCH ==
        "main" && $CI_COMMIT_TAG == null))
  script:
    - npm i -g corepack
    - yarn
    - yarn check

check-versions:
  image: registry.gitlab.com/storyteller-platform/storyteller/storyteller-base:main
  stage: check
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - apt update && apt install -y --no-install-recommends git-lfs
    - git fetch origin main:refs/remotes/origin/main
    - yarn workspaces focus storyteller
    - yarn node ./scripts/checkVersions.mts

check-docs:
  image: registry.gitlab.com/storyteller-platform/storyteller/storyteller-base:main
  stage: check
  tags: [saas-linux-large-amd64]
  rules:
    - if:
        ($CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_COMMIT_BRANCH ==
        "main" && $CI_COMMIT_TAG == null))
      changes:
        - applications/docs/**/*
  script:
    - npm i -g corepack
    - yarn
    - yarn build:docs

