check:
  image: registry.gitlab.com/storyteller-platform/storyteller/storyteller-base:main
  stage: check
  tags: [saas-linux-large-amd64]
  rules:
    - if:
        ($CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_COMMIT_BRANCH ==
        "main" && $CI_COMMIT_TAG == null))
  script:
    - npm i -g corepack
    - yarn
    - yarn workspace @storyteller-platform/align build
    - yarn check

check-versions:
  image: registry.gitlab.com/storyteller-platform/storyteller/storyteller-base:main
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch origin main --depth 1
    - yarn workspaces focus storyteller
    - yarn node ./scripts/checkVersions.mts

check-docs:
  image: registry.gitlab.com/storyteller-platform/storyteller/storyteller-base:main
  stage: check
  tags: [saas-linux-large-amd64]
  rules:
    - if:
        ($CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_COMMIT_BRANCH ==
        "main" && $CI_COMMIT_TAG == null))
      changes:
        - docs/**/*
  script:
    - npm i -g corepack
    - yarn
    - yarn build:docs

