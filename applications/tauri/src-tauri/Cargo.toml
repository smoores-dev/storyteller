[package]
name = "storyteller-tauri"
version = "2.14.13"
description = "Storyteller — a platform for immersive reading with synced audiobooks and ebooks"
license = "MIT"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
tauri = { version = "2", features = ["config-json5", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde_json = "1"
tar = "0.4"
flate2 = "1"
rand = "0.8"
anyhow = "1"
tauri-plugin-os = "2.3.2"
tauri-plugin-fs = "2.5.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"

[profile.release]
strip = true
lto = true
